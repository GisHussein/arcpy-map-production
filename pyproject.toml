[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcpy-map-production"
version = "0.1.0"
description = "Batch map series production for ArcGIS Pro, with layout pre-flight checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hussein Fanjry" }]
keywords = ["arcgis", "arcpy", "gis", "cartography", "map-series", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mapseries = "mapseries.cli:main"

[project.urls]
Repository = "https://github.com/GisHussein/arcpy-map-production"

[tool.setuptools.packages.find]
include = ["mapseries*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
